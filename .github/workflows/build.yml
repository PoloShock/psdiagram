name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Build and test
        run: mvn -B clean package
      - name: Build the release Maven plugins (tools/)
        run: mvn -B -f tools install

  launcher:
    # Same toolchain as the devcontainer (Debian bookworm MinGW), so the rebuild must match the committed exe
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 (i686)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc-mingw-w64-i686 binutils-mingw-w64-i686
      - name: Rebuild PS Diagram.exe and compare with the committed one
        run: sh tools/launcher/build.sh --check
