name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Build and test
        run: ./mvnw -B clean package
      - name: Build the release Maven plugins (tools/)
        run: ./mvnw -B -f tools install
  # The launcher exe (tools/launcher) is built and checked locally on Windows only (build.ps1 [-Check]).
